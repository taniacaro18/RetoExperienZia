<div class="space-y-6 max-w-4xl">
  <div>
    <h1 class="text-2xl font-bold text-surface-900">Mi perfil</h1>
    <p class="text-surface-500 text-sm">Actualiza tu información personal y contraseña.</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Tarjeta lateral resumen -->
    <p-card styleClass="!shadow-card">
      <div class="text-center">
        <p-avatar
          [label]="iniciales(store.usuario()?.nombre)"
          shape="circle"
          styleClass="!w-24 !h-24 !text-3xl !bg-brand-gradient !text-white"
        ></p-avatar>
        <h2 class="text-lg font-semibold text-surface-900 mt-4">
          {{ store.usuario()?.nombre }}
        </h2>
        <p class="text-sm text-surface-500">{{ store.usuario()?.email }}</p>

        <div class="flex flex-wrap justify-center gap-2 mt-4">
          <p-tag [value]="store.rol() ?? ''" severity="info"></p-tag>
          <p-tag
            [value]="store.usuario()?.estado ?? ''"
            [severity]="store.usuario()?.estado === 'ACTIVO' ? 'success' : 'warn'"
          ></p-tag>
        </div>
      </div>
    </p-card>

    <!-- Formulario -->
    <p-card styleClass="!shadow-card lg:col-span-2">
      <h2 class="text-lg font-semibold text-surface-900 mb-4">Datos personales</h2>

      <form [formGroup]="formulario" (ngSubmit)="guardar()" class="space-y-4" novalidate>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-surface-700 mb-1.5">Nombre completo</label>
            <input pInputText formControlName="nombre" class="w-full" />
          </div>
          <div>
            <label class="block text-sm font-medium text-surface-700 mb-1.5">Correo electrónico</label>
            <input pInputText type="email" formControlName="email" class="w-full" />
          </div>
          <div>
            <label class="block text-sm font-medium text-surface-700 mb-1.5">Teléfono</label>
            <input pInputText formControlName="telefono" class="w-full" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-surface-700 mb-1.5">Tipo doc.</label>
              <p-select
                formControlName="tipoDocumento"
                [options]="tiposDocumento"
                optionLabel="label"
                optionValue="value"
                styleClass="w-full"
                appendTo="body"
              ></p-select>
            </div>
            <div>
              <label class="block text-sm font-medium text-surface-700 mb-1.5">Número</label>
              <input pInputText formControlName="numeroDocumento" class="w-full" />
            </div>
          </div>
        </div>

        <div class="border-t border-surface-100 pt-4">
          <h3 class="text-sm font-semibold text-surface-700 mb-2">
            Cambiar contraseña <span class="text-surface-400 font-normal">(opcional)</span>
          </h3>
          <p-password
            formControlName="nuevaPassword"
            [toggleMask]="true"
            [feedback]="true"
            inputStyleClass="w-full"
            styleClass="w-full"
            placeholder="Déjalo vacío si no quieres cambiarla"
          ></p-password>
        </div>

        <div class="flex justify-end pt-2">
          <p-button
            type="submit"
            label="Guardar cambios"
            icon="pi pi-save"
            styleClass="!bg-brand-600 !border-brand-600 hover:!bg-brand-700"
            [loading]="cargando()"
          ></p-button>
        </div>
      </form>
    </p-card>
  </div>
</div>
