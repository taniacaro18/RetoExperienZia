# Perfil para probar la API sin PostgreSQL (Postman en local).
#
# Arranque (elige uno):
#   PowerShell:  $env:SPRING_PROFILES_ACTIVE='dev'; .\mvnw.cmd spring-boot:run
#   Maven:       .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
#   IDE:         VM options  -Dspring.profiles.active=dev   o program args  --spring.profiles.active=dev
#
# Postman: base URL http://localhost:8080  |  prueba GET http://localhost:8080/actuator/health

spring.datasource.url=jdbc:h2:mem:experienzia;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
